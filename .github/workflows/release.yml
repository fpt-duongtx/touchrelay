name: Release

# Tạo bản build ad-hoc (chưa notarize) khi đẩy tag dạng v*, ví dụ: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Apple Silicon + Intel)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show
      - name: Test
        run: cargo test --all-targets
      - name: Build universal app (ad-hoc signed)
        run: UNIVERSAL=1 ./scripts/make-app.sh
      - name: Show checksums (written by make-app.sh)
        run: cat dist/TouchRelay.dmg.md5 dist/TouchRelay.dmg.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TouchRelay.dmg dist/TouchRelay.dmg.md5 dist/TouchRelay.dmg.sha256 \
            --title "TouchRelay $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Download **TouchRelay.dmg**, open it and drag TouchRelay to Applications. Ad-hoc signed, **not notarized**: if macOS blocks it, see *If macOS blocks the app* in the README. Verify the MD5 / SHA-256 checksum."
